name: Release EPUBs

on:
  push:
    branches:
      - main # Dispara automaticamente a cada novo commit na branch principal

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para criar a release e a tag

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Traz todo o histórico
          
      - name: Generate Automatic Version
        id: version
        # Usa o ID da run do GitHub Actions para criar uma versão única e incremental (ex: v1.0.1, v1.0.2)
        run: echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Get Commit Message
        id: get_commit
        run: |
          # Extrai a mensagem do commit
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "message<<$EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Zip EPUBs Directory
        run: |
          cd epubs
          zip -r ../vatican-encyclicals-collection.zip ./*.epub
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Notas da Versão
            ${{ steps.get_commit.outputs.message }}
          files: vatican-encyclicals-collection.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
