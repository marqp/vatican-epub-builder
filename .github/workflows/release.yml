name: Release EPUBs

on:
  push:
    tags:
      - 'v*' # Dispara o workflow quando você faz push de uma tag começando com 'v' (ex: v1.0.0)

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para criar a release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Traz todo o histórico para poder extrair a mensagem de commit
      
      - name: Get Commit Message
        id: get_commit
        run: |
          # Extrai a mensagem do commit que gerou a tag
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          # Cria um multiline output pro GitHub Actions (sintaxe nova)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "message<<$EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Zip EPUBs Directory
        run: |
          # Cria um arquivo zip contendo todos os EPUBs
          cd epubs
          zip -r ../vatican-encyclicals-collection.zip ./*.epub
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Notas da Versão
            ${{ steps.get_commit.outputs.message }}
          files: vatican-encyclicals-collection.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
