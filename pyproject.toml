[project]
name = "vatican-epub-builder"
version = "1.0.0"
description = "A Python tool to automatically generate clean, beautifully formatted EPUB versions of Encyclicals from vatican.va"
authors = [
    {name = "Magnifica"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.2.1",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    ".venv2",
    "build",
    "__pycache__",
    "epubs",
    "sources",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
